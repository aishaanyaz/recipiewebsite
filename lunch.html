<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunch Recipes - Healthy Treats</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .recipe-header {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                        url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c');
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding: 4rem 2rem;
            margin-bottom: 2rem;
        }

        .recipe-header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #f3f3f3;
            font-family: 'Nunito', sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .recipe-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .recipe-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .recipe-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .recipe-info {
            padding: 1.5rem;
        }

        .recipe-info h3 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .recipe-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.9rem;
            color: #666;
            margin-top: 1rem;
        }

        .recipe-meta span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        #loading {
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #FF6B6B;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">TASTY TREATS</div>
        <nav>
            <ul>
                <li><a href=landingpage.html>HOME</a></li>
                <li class="dropdown">
                    <a href="#">RECIPES</a>
                    <ul class="dropdown-menu">
                        <li><a href=breakfast.html>Breakfast</a></li>
                        <li><a href=lunch.html>Lunch</a></li>
                        <li><a href=dinner.html>Dinner</a></li>
                        <li><a href=cholesterol.html>Cholesterol</a></li>
                        <li><a href=heart-disease.html>Heart Disease</a></li>
                        <li><a href=high-blood-pressure.html>High Blood Pressure</a></li>
                        <li><a href=diabetes.html>Diabetes</a></li>
                    </ul>
                </li>
                <li><a href=login.html>LOGIN/SIGN UP</a></li>
            </ul>
        </nav>
    </header>

    <div class="recipe-header">
        <h1>Healthy Lunch Recipes</h1>
        <p>Discover nutritious and delicious lunch ideas</p>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p>Loading recipes...</p>
    </div>

    <div class="recipe-grid" id="recipe-container">
        <!-- Recipes will be loaded here -->
    </div>

    <script>
        const API_KEY = 'c964e9508dad440cb0220a49bd3e0b1e';

        async function fetchLunchRecipes() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('recipe-container');
            
            loading.style.display = 'block';
            container.innerHTML = '';

            try {
                const response = await fetch(
                    `https://api.spoonacular.com/recipes/complexSearch?apiKey=${API_KEY}&type=main course&tags=lunch&number=12&addRecipeInformation=true`
                );
                const data = await response.json();

                data.results.forEach(recipe => {
                    const card = document.createElement('div');
                    card.className = 'recipe-card';
                    card.innerHTML = `
                        <img src="${recipe.image}" alt="${recipe.title}">
                        <div class="recipe-info">
                            <h3>${recipe.title}</h3>
                            <div class="recipe-meta">
                                <span><i class="far fa-clock"></i> ${recipe.readyInMinutes} mins</span>
                                <span><i class="fas fa-fire"></i> ${recipe.calories || 'N/A'} cal</span>
                            </div>
                        </div>
                    `;
                    
                    card.addEventListener('click', () => {
                        window.location.href = `recipe-details.html?id=${recipe.id}`;
                    });
                    
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error fetching recipes:', error);
                container.innerHTML = '<p>Error loading recipes. Please try again later.</p>';
            } finally {
                loading.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchLunchRecipes);
    </script>
</body>
</html>
