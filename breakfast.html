<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakfast Recipes - Tasty Treats</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Shadows+Into+Light&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Francois+One&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            position: relative;
        }

        .background-carousel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .background-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        header {
            background-color: rgba(255, 228, 237, 0.9);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 0.7rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Francois One', sans-serif;
            font-size: 2rem;
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 0.8rem;
            animation: float 3s ease-in-out infinite;
        }

        nav ul {
            display: flex;
            justify-content: center;
            gap: 2rem;
            list-style: none;
            padding: 0;
        }

        nav ul li a {
            text-decoration: none;
            color: #4a4a4a;
            font-weight: 600;
            font-family: 'Francois One', sans-serif;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        nav ul li a:hover {
            color: #ff6b6b;
            background-color: #fff5f5;
            transform: translateY(-2px);
        }

        .recipes {
            padding: 3rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .recipes h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 3rem;
            color: #000000;
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            padding: 1rem;
        }

        .recipe-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1;
        }

        .recipe-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .recipe-card img {
            width: 100%;
            height: 75%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .recipe-card:hover img {
            transform: scale(1.05);
        }

        .recipe-card h3 {
            padding: 1rem;
            margin: 0;
            font-family: 'Nunito', sans-serif;
            font-size: 1.2rem;
            color: #2d3436;
            text-align: center;
            transition: all 0.3s ease;
            height: 25%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .recipe-card:hover h3 {
            color: #ff6b6b;
        }

        footer {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 1.5rem;
            text-align: center;
            color: #666;
            box-shadow: 0 -4px 6px rgba(0,0,0,0.05);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes titleFloat {
            0% { transform: translate(0, 0); }
            25% { transform: translate(10px, -10px); }
            50% { transform: translate(0, -20px); }
            75% { transform: translate(-10px, -10px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>
    <div class="background-carousel">
        <!-- Background images will be inserted here -->
    </div>

    <header>
        <div class="logo">TASTY TREATS</div>
        <nav>
            <ul>
                <li><a href=landingpage.html>HOME</a></li>
                <li class="dropdown">
                    <a href="#">RECIPES</a>
                    <ul class="dropdown-menu">
                        <li><a href=breakfast.html>Breakfast</a></li>
                        <li><a href=lunch.html>Lunch</a></li>
                        <li><a href=dinner.html>Dinner</a></li>
                        <li><a href=cholesterol.html>Cholesterol</a></li>
                        <li><a href=heart-disease.html>Heart Disease</a></li>
                        <li><a href=high-blood-pressure.html>High Blood Pressure</a></li>
                        <li><a href=diabetes.html>Diabetes</a></li>
                    </ul>
                </li>
                <li><a href=login.html>LOGIN/SIGN UP</a></li>
            </ul>
        </nav>
    </header>

    <section class="recipes">
        <h2 id="breakfast-title">Breakfast Recipes</h2>
        <div id="recipe-grid" class="recipe-grid">
            <!-- Recipes will be dynamically inserted here -->
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Tasty Treats - Delicious Recipes For Everyone</p>
    </footer>

    <script>
        const API_KEY = 'c964e9508dad440cb0220a49bd3e0b1e';
        
        async function fetchBackgroundImages() {
            try {
                const response = await fetch(
                    `https://api.spoonacular.com/recipes/complexSearch?apiKey=${API_KEY}&type=breakfast&number=5`
                );
                const data = await response.json();
                setupBackgroundCarousel(data.results);
            } catch (error) {
                console.error('Error fetching background images:', error);
            }
        }

        function setupBackgroundCarousel(recipes) {
            const carousel = document.querySelector('.background-carousel');
            recipes.forEach((recipe, index) => {
                const img = document.createElement('img');
                img.src = recipe.image;
                img.className = 'background-image';
                img.style.opacity = index === 0 ? '1' : '0';
                carousel.appendChild(img);
            });

            let currentIndex = 0;
            setInterval(() => {
                const images = document.querySelectorAll('.background-image');
                images[currentIndex].style.opacity = '0';
                currentIndex = (currentIndex + 1) % images.length;
                images[currentIndex].style.opacity = '1';
            }, 5000);
        }
        
        async function fetchBreakfastRecipes() {
            try {
                const response = await fetch(
                    `https://api.spoonacular.com/recipes/complexSearch?apiKey=${API_KEY}&type=breakfast&number=12`
                );
                const data = await response.json();
                displayRecipes(data.results);
            } catch (error) {
                console.error('Error fetching recipes:', error);
                const recipeGrid = document.getElementById('recipe-grid');
                recipeGrid.innerHTML = '<p style="text-align: center; color: #ff6b6b;">Unable to load recipes. Please try again later.</p>';
            }
        }

        function displayRecipes(recipes) {
            const recipeGrid = document.getElementById('recipe-grid');
            recipeGrid.innerHTML = '';

            recipes.forEach((recipe, index) => {
                const recipeCard = document.createElement('div');
                recipeCard.className = 'recipe-card';
                recipeCard.style.animation = `fadeIn 0.5s ease forwards ${index * 0.1}s`;
                recipeCard.innerHTML = `
                    <img src="${recipe.image}" alt="${recipe.title}">
                    <h3>${recipe.title}</h3>
                `;
                
                recipeCard.addEventListener('click', () => {
                    window.location.href = `recipe-details.html?id=${recipe.id}`;
                });
                
                recipeGrid.appendChild(recipeCard);
            });
        }

        // Add floating animation to the title
        function animateTitle() {
            const title = document.getElementById('breakfast-title');
            title.style.animation = 'titleFloat 4s ease-in-out infinite';
        }

        window.addEventListener('load', () => {
            fetchBackgroundImages();
            fetchBreakfastRecipes();
            animateTitle();
        });
    </script>
</body>
</html>
